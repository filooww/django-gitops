# Секреты приложения берутся из Vault через External Secrets Operator.
# В git только ссылки на пути в Vault, самих значений здесь нет.
#
#   Vault secret/django/app       -> Secret django-app-secret           (DJANGO_SECRET_KEY)
#   Vault secret/django/postgres  -> Secret django-postgres-credentials (POSTGRES_DB/USER/PASSWORD)

# ServiceAccount, которым ESO входит в Vault (роль django в auth/kubernetes)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: django-vault
  namespace: django
---
# Откуда брать секреты: Vault внутри кластера, KV v2 по пути secret/
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: django
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: django
          serviceAccountRef:
            name: django-vault
            audiences: [vault]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-app-secret
  namespace: django
spec:
  refreshInterval: 1h                 # как часто перечитывать Vault
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: django-app-secret           # то же имя, что и раньше: чарт менять не нужно
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: django/app               # все ключи из secret/django/app
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: django-postgres-credentials
  namespace: django
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: SecretStore
  target:
    name: django-postgres-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: django/postgres
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
