apiVersion: v1
kind: Service
metadata:
  name: {{ include "django-app.fullname" . }}-django-canary
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: django
  ports:
    - name: http
      port: 80
      targetPort: http
