apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "django-app.fullname" . }}-django
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
    app.kubernetes.io/component: django
spec:
  replicas: {{ .Values.django.replicaCount }}
  revisionHistoryLimit: 5
  progressDeadlineSeconds: {{ .Values.django.rollout.progressDeadlineSeconds }}
  progressDeadlineAbort: true
  strategy:
    canary:
      canaryService: {{ include "django-app.fullname" . }}-django-canary
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 25
        - analysis:
            templates:
              - templateName: {{ include "django-app.fullname" . }}-smoke
        - setWeight: 50
        - pause: {duration: {{ .Values.django.rollout.pauseBetweenSteps }}}
        - setWeight: 100
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: django
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: django
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/django-configmap.yaml") . | sha256sum }}
    spec:
      containers:
        - name: django
          image: "{{ .Values.django.image.repository }}:{{ .Values.django.image.tag }}"
          imagePullPolicy: {{ .Values.django.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.django.containerPort }}
          {{- include "django-app.env" . | nindent 10 }}
          livenessProbe:
            {{- toYaml .Values.django.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.django.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.django.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.django.securityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
