apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.fullname" . }}-postgres
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_DB: {{ .Values.postgresql.database | b64enc }}
  POSTGRES_USER: {{ .Values.postgresql.username | b64enc }}
  POSTGRES_PASSWORD: {{ required "postgresql.password is required" .Values.postgresql.password | b64enc }}

