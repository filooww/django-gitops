{{- if not .Values.django.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "django-app.fullname" . }}-django
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
type: Opaque
data:
  DJANGO_SECRET_KEY: {{ required "django.secretKey is required" .Values.django.secretKey | b64enc }}
{{- end }}
