apiVersion: v1
kind: Service
metadata:
  name: {{ include "django-app.fullname" . }}-postgres
  labels:
    {{- include "django-app.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/instance : {{ .Release.Name }}
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
