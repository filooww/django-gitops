apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: django
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://github.com/filooww/django-gitops.git
      targetRevision: main
      path: charts/django-app
      helm:
        releaseName: django
    - repoURL: https://github.com/filooww/django-gitops.git
      targetRevision: main
      path: secrets/django
  destination:
    server: https://kubernetes.default.svc
    namespace: django
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      