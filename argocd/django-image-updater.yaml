apiVersion: argocd-image-updater.argoproj.io/v1alpha1
kind: ImageUpdater
metadata:
  name: django
  namespace: argocd
spec:
  writeBackConfig:
    method: git:secret:git-creds
    gitConfig:
      branch: main
      writeBackTarget: helmvalues:/charts/django-app/values.yaml
  applicationRefs:
    - namePattern: django
      images:
        - alias: django
          imageName: ghcr.io/filooww/django-app
          commonUpdateSettings:
            updateStrategy: semver
            allowTags: regexp:^[0-9]+\.[0-9]+\.[0-9]+$
          manifestTargets:
            helm:
              name: django.image.repository
              tag: django.image.tag
