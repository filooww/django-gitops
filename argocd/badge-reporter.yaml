apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: badge-reporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/filooww/django-gitops.git
    targetRevision: main
    path: apps/badge-reporter
  destination:
    server: https://kubernetes.default.svc
    namespace: django
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
